<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Safeguarding 3D</title>
<style>body{margin:0;background:#101d2b;color:#eef4fa;font:14px system-ui}aside{position:absolute;z-index:1;top:16px;left:16px;width:290px;max-height:85vh;overflow:auto;background:#172a3eee;padding:18px;border-radius:12px}h1{font-size:20px;margin-top:0}label{display:block;margin:12px 0}button{padding:8px;cursor:pointer}small{color:#b9cadd}#info{white-space:pre-wrap}canvas{display:block}</style>
<aside><h1 id="title"></h1><small id="note"></small><p>Drag to orbit · scroll to zoom · right-drag to pan</p><button id="reset">Reset view</button><label>Surface opacity <input id="opacity" type="range" min="0.1" max="1" step="0.05" value="0.55"></label><div id="layers"></div><p id="info">Click a surface to inspect.</p></aside>
<!-- /*LICENSE*/ -->
<script>/*THREE*/</script><script>/*ORBIT*/</script><script>
const data=/*SCENE*/;
document.getElementById('title').textContent=data.title;document.getElementById('note').textContent=data.note+' · '+data.crs;
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,1,1e7),renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.body.appendChild(renderer.domElement);
const controls=new THREE.OrbitControls(camera,renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x536375,1.4));const sun=new THREE.DirectionalLight(0xffffff,0.7);sun.position.set(1,3,2);scene.add(sun);
const meshes=[];for(const [i,layer] of data.layers.entries()){const geometry=new THREE.BufferGeometry();geometry.setAttribute('position',new THREE.Float32BufferAttribute(layer.vertices,3));geometry.computeVertexNormals();const color=layer.model==='terrain'?new THREE.Color(0x788b69):new THREE.Color().setHSL((i*.137)%1,.65,.6);const mesh=new THREE.Mesh(geometry,new THREE.MeshStandardMaterial({color,side:THREE.DoubleSide,transparent:true,opacity:.55,depthWrite:false,roughness:1}));mesh.userData=layer;scene.add(mesh);meshes.push(mesh);const label=document.createElement('label'),check=document.createElement('input');check.type='checkbox';check.checked=true;check.onchange=()=>mesh.visible=check.checked;label.append(check,document.createTextNode(' '+layer.name));document.getElementById('layers').append(label);}
const box=new THREE.Box3();meshes.forEach(m=>box.expandByObject(m));const center=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3()),span=Math.max(size.x,size.y,size.z,100);function reset(){controls.target.copy(center);camera.position.copy(center).add(new THREE.Vector3(span*.9,span*.8,span*.9));camera.far=span*30;camera.updateProjectionMatrix();controls.update()}reset();document.getElementById('reset').onclick=reset;document.getElementById('opacity').oninput=e=>meshes.forEach(m=>m.material.opacity=Number(e.target.value));
const ray=new THREE.Raycaster();let down;renderer.domElement.onpointerdown=e=>down=[e.clientX,e.clientY];renderer.domElement.onpointerup=e=>{if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>4)return;ray.setFromCamera(new THREE.Vector2(e.clientX/innerWidth*2-1,1-e.clientY/innerHeight*2),camera);const hit=ray.intersectObjects(meshes.filter(m=>m.visible))[0];if(hit)document.getElementById('info').textContent=hit.object.userData.name+'\nDisplayed elevation: '+hit.point.y.toFixed(2)+' m\n'+JSON.stringify(hit.object.userData.metadata,null,2)};
onresize=()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)};function draw(){requestAnimationFrame(draw);controls.update();renderer.render(scene,camera)}draw();
</script></html>
